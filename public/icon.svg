<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b93a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.15" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#glow)"/>

  <!-- Fanned stack of flashcards -->
  <g transform="translate(256,268)">
    <!-- Back card -->
    <g transform="rotate(-14) translate(0,-30)">
      <rect x="-118" y="-78" width="236" height="156" rx="28" fill="#ffffff" fill-opacity="0.28"/>
    </g>
    <!-- Middle card -->
    <g transform="rotate(-7) translate(0,-15)">
      <rect x="-118" y="-78" width="236" height="156" rx="28" fill="#ffffff" fill-opacity="0.55"/>
    </g>
    <!-- Front card -->
    <g filter="url(#shadow)">
      <rect x="-118" y="-78" width="236" height="156" rx="28" fill="#ffffff"/>
    </g>
    <!-- Word -->
    <rect x="-82" y="-40" width="104" height="20" rx="10" fill="#ea580c"/>
    <!-- Definition lines -->
    <rect x="-82" y="2" width="164" height="12" rx="6" fill="#fdba74"/>
    <rect x="-82" y="26" width="112" height="12" rx="6" fill="#fed7aa"/>
    <!-- "Got it" badge -->
    <circle cx="78" cy="-30" r="18" fill="#ea580c"/>
    <path d="M69.5,-30 L75.5,-24 L87,-37" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
